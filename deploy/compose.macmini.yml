# 맥미니 배포용 — sofie-nginx와 같은 망(sofie-portfolio_default)에 붙어서
# nginx가 http://exist-app:4000 으로 프록시. OPENAI_API_KEY·ANNOUNCED_IP는 .env로.
services:
  exist-app:
    image: exist-app:latest
    container_name: exist-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 회의 후 원음 재전사 모델 (stt.ts) — 기록·결정 추출 품질용
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}
      # 온프레미스 STT — 맥미니 호스트의 whisper.cpp 서버(launchd co.sofie.exist.whisper, 8178).
      # 있으면 음성이 외부로 안 나감. 실패 시 OpenAI 폴백. 비우면 OpenAI만.
      WHISPER_URL: ${WHISPER_URL:-}
      # 둘 다 있을 때 우선: openai(정확도) | local(온프레미스 — 음성 외부 전송 없음)
      STT_PREFER: ${STT_PREFER:-openai}
      # 스트리밍 자막 (stt-live.ts) — Realtime 전사 세션. STT_LIVE=off 면 Web Speech/청크 경로만
      OPENAI_STT_LIVE_MODEL: ${OPENAI_STT_LIVE_MODEL:-gpt-live-transcribe}
      STT_LIVE: ${STT_LIVE:-on}
      # 결정 추출 전용 상위 모델 (recap.ts) — 나머지 AI는 OPENAI_MODEL(mini)
      OPENAI_MODEL_RECAP: ${OPENAI_MODEL_RECAP:-gpt-4o}
      # 판정 전용(복명복창 모순·안건 깨우기 judge·근거 검증) — 오탐 민감
      OPENAI_MODEL_JUDGE: ${OPENAI_MODEL_JUDGE:-gpt-4o}
      ANNOUNCED_IP: ${ANNOUNCED_IP}
      # 같은 공유기(LAN) 안 통화용 사설 IP — 헤어핀 NAT 회피. 맥미니 LAN IP.
      LOCAL_IP: ${LOCAL_IP:-192.168.0.82}
      # WebRtcServer — 모든 통화가 포트 2개를 나눠 쓴다 (40000=LOCAL_IP, 40001=ANNOUNCED_IP)
      RTC_PORT: "40000"
      # 예전엔 lima 가 UDP 를 못 넘겨 TCP 우선이었다. 이제 맥 pf 가 UDP 도 VM 으로 넘기므로 UDP 우선.
      MEDIA_PREFER_TCP: "0"
      # 코드 실행(/exec)은 격리된 runner 컨테이너로 위임. git push(/git)만 게이트.
      RUNNER_URL: http://runner:5000
      CODE_EXEC_ENABLED: ${CODE_EXEC_ENABLED:-0}
      # 웹푸시(PWA) — VAPID 키는 .env로
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      # 4000은 nginx가 망 안에서 접근하므로 미공개. 미디어는 UDP+TCP 둘 다 publish.
      # Colima VM 주소에만 바인딩 — 0.0.0.0 이면 lima 가 맥으로 포워딩하려 들고(예전 200여 개가
      # 여기서 무너졌다), VM 주소 바인딩은 lima 가 건드리지 않는다. 바깥 → 맥 en0 → VM 은
      # 맥의 pf 규칙(~/bin/colima-watchdog.sh 의 ensure_pf)이 넘긴다.
      # VM 주소가 바뀌면 컨테이너가 못 뜬다 → .env 의 MEDIA_BIND_IP 로 맞출 것 (`colima list`).
      - "${MEDIA_BIND_IP:-192.168.64.2}:40000-40001:40000-40001/udp"
      - "${MEDIA_BIND_IP:-192.168.64.2}:40000-40001:40000-40001/tcp"
    volumes:
      - exist-data:/data
    networks:
      - sofie-portfolio_default # nginx 프록시 + 외부
      - runner-net # 격리 러너와 내부 통신
    depends_on:
      - runner

  # 격리된 코드 실행 전용 컨테이너 (이미지는 별도 빌드: docker build -t exist-runner:latest ../runner)
  # internal 네트워크(인터넷 차단) + 권한 제거 + read_only + 자원 제한.
  runner:
    image: exist-runner:latest
    container_name: exist-runner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:exec,size=256m,mode=1777
    mem_limit: 512m
    cpus: "0.75"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    networks:
      - runner-net # internal 전용 → 외부 인터넷 불가

volumes:
  # 외부 볼륨(접두사 없는 exist-data)에 실데이터가 있음. external 미지정 시
  # compose가 exist_exist-data를 새로 만들어 빈 DB로 떠버리므로 반드시 external.
  exist-data:
    external: true

networks:
  sofie-portfolio_default:
    external: true
  runner-net:
    internal: true # 외부 라우팅 없음(코드 실행 컨테이너 격리)
